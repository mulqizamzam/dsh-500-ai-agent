# Agent Registry — dsh-500-ai-agent
#
# Schema per types.ts. All entries require:
#   agent_id, name, version, runtime, entrypoint, capabilities,
#   permissions, resources, source, status, root
#
# Security posture: default-deny. Every permission leaf defaults to its
# closed value. Permission overrides are DENIED if the agent does not
# declare them.
#
# Only agent 21 (pii-sanitization) is registered here as the reference agent.
# Additional agents will be added after Phase 8 validation.

pii-sanitization:
  agent_id: pii-sanitization
  name: PII Sanitization Agent
  version: 1.0.0
  runtime:
    type: python
    version: "3.11"
  entrypoint: agent.py
  entrypoint_args:
    - "--text"
    - "{{task}}"
    - "--tx-hash"
    - "TRIAL"
    - "--context"
    - "general"
  capabilities:
    - pii
    - security
    - compliance
    - general
  permissions:
    network: true
    filesystem: null
    shell: false
    # TRUSTBOOST_API_BASE is the upstream base URL. It is declared here as an
    # explicit env channel so the e2e suite can point the agent at a local
    # fixture; the bridge forwards it ONLY because it is listed, never by name.
    secrets:
      - TRUSTBOOST_API_BASE
      - OPENAI_MODEL
      - REASONING_EFFORT
  resources:
    timeout_ms: 120000
  source:
    repository: ashishpatel26/500-AI-Agents-Projects
    path: agents/21-pii-sanitization-agent
    commit: 9beeb721c2af551bacaab827a76bddaecaa0ca5e
  status: experimental
  maturity: experimental
  root: ../../../../500-AI-Agents-Projects/agents/21-pii-sanitization-agent

